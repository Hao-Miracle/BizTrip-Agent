name: Windows One-Click Build

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and packager
        run: python -m pip install -e ".[llm,test]" pyinstaller

      - name: Run tests
        run: python -m pytest

      - name: Build one-click executable
        run: pyinstaller --clean --noconfirm biztrip_windows.spec

      - name: Smoke test executable exists
        shell: pwsh
        run: |
          $exe = "dist\BizTrip-Agent-Windows.exe"
          if (-not (Test-Path $exe)) { throw "Windows executable was not created" }
          $size = (Get-Item $exe).Length
          if ($size -lt 1000000) { throw "Windows executable is unexpectedly small" }
          Write-Host "Built $exe ($size bytes)"

      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: BizTrip-Agent-Windows
          path: dist/BizTrip-Agent-Windows.exe
          if-no-files-found: error
          retention-days: 14
